# AI Council Configuration

# Auth mode: "oauth" (mount host credentials) or "apikey" (pass env vars from council.env)
AUTH_MODE="oauth"

# Host credential directories (for oauth mode)
CLAUDE_AUTH_DIR="${HOME}/.claude"
CODEX_AUTH_DIR="${HOME}/.codex"
GEMINI_AUTH_DIR="${HOME}/.gemini"
VIBE_AUTH_DIR="${HOME}/.vibe"

# Agent timeout in seconds
AGENT_TIMEOUT=300

# Space-separated list of enabled agents
ENABLED_AGENTS="claude codex gemini vibe"

# Container image name
IMAGE_NAME="council"
IMAGE_TAG="latest"

# Synthesizer model (used by host Claude for synthesis)
SYNTHESIZER_MODEL="sonnet"

# Verbose output (0=quiet, 1=verbose)
VERBOSE=0

# Collaborative mode defaults
COLLAB_MAX_ROUNDS=2
COLLAB_MAX_CONTEXT_CHARS=50000
